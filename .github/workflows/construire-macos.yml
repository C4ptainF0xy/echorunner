name: Construire Echo pour macOS Apple Silicon

# ═══════════════════════════════════════════════════════════════════════════════
# POURQUOI CE DEPOT EXISTE.
#
# Le launcher se construit sur une forge privee (workspace.prismodev.com), dont
# le runner macOS est une VM QEMU emulant un CPU Intel Penryn. electron-builder
# prend l'architecture de l'hote, donc ce runner ne peut produire QUE du x86_64.
# Verifie le 2026-08-30 sur le paquet livre: `Mach-O 64-bit x86_64`, une seule
# tranche. Sur un Mac Apple Silicon, tout Echo tourne alors sous Rosetta, JIT de
# V8 compris: rien ne casse, tout rame, a chaque action.
#
# Ce depot-ci n'existe que pour emprunter une machine ARM64 a GitHub, qui en
# offre. Il ne contient PAS le code du launcher, et ne doit jamais le contenir:
# il le clone depuis la forge au moment du build, et la source ne vit que sur le
# runner ephemere. Un depot GitHub public rendrait la source et tout
# l'historique clonables par n'importe qui, ce que le projet refuse.
#
# CE DEPOT EST PUBLIC, ET C'EST PRECISEMENT PARCE QU'IL EST VIDE. Sur un depot
# prive, GitHub facture les minutes macOS au DECUPLE: les 2000 offertes valent
# environ 200 minutes macOS reelles, et une seule notarisation lente les mange.
# Public, elles sont gratuites et illimitees.
#
# Ce que cela expose, et qu'il faut assumer: les JOURNAUX deviennent lisibles
# par tous. Ils listent l'arbre des dependances du launcher et des chemins de
# fichiers -- pas une ligne de code, mais sa structure. Les secrets, eux, ne
# risquent rien: GitHub ne les passe jamais a un workflow declenche depuis un
# fork, et workflow_dispatch exige un droit d'ecriture.
#
# LA REGLE QUI RESTE, ELLE, ABSOLUE: aucun code du launcher ne doit etre
# COMMITE ici. Il est clone au moment du build et disparait avec le runner.
#
# CE QUI A RENDU CECI POSSIBLE. `python_rpc` est fige par cx_Freeze, qui ne sait
# pas compiler pour une autre architecture que la sienne. On croyait donc devoir
# renoncer a l'ARM64 ou acheter un Mac. Mais rien n'a besoin d'etre croise:
# `libtorrent` publie des roues macOS arm64 (2.1.1, CPython 3.9 a 3.13), donc
# sur un hote arm64 tout se construit nativement, sans un seul artifice.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Le tag a construire, avec le v (ex: v0.7.46)"
        required: true
        type: string
      notariser:
        # ═══ SEPAREE DU RESTE, ET C'EST CE QUI L'A DEBLOQUEE ═══
        #
        # La notarisation d'electron-builder a bloque trois runs, jusqu'a
        # 2 h 52 sans rendre la main. Or `notarytool history` montrait, pendant
        # ces memes runs, deux soumissions `status: Accepted`: Apple avait
        # repondu, et c'est `submit --wait` qui ne voyait pas la reponse.
        #
        # L'etape « Notariser et agrafer » soumet donc sans attendre et
        # interroge le verdict elle-meme. Elle reste une case a cocher parce
        # qu'elle ajoute une dizaine de minutes: un build de depannage n'en a
        # pas besoin, une release oui.
        description: "Notariser chez Apple (une dizaine de minutes de plus)"
        required: false
        default: false
        type: boolean

jobs:
  macos:
    # macos-15, pas macos-26: les roues arm64 de libtorrent ciblent macOS 14 et
    # 15, et une roue ne s'installe jamais sur un systeme plus ANCIEN que sa
    # cible. Prendre l'image la plus recente ferait dependre le build de roues
    # qui n'existent pas encore, pour aucun gain.
    runs-on: macos-15

    # ═══ UNE LIMITE, PARCE QU'UN BLOCAGE NE DOIT PAS DURER SIX HEURES ═══
    #
    # C'est la limite par defaut de GitHub, et trois runs l'ont frolee avant
    # qu'on comprenne d'ou venait le blocage. Elle ne coute rien en argent -- ce
    # depot est public, ses minutes sont gratuites -- mais elle coute du temps
    # de mur, et surtout elle transforme une panne en attente indistinguable
    # d'un travail en cours.
    #
    # 180 minutes couvrent tres largement un build complet, notarisation
    # comprise: le build seul tient en un quart d'heure, et le verdict d'Apple
    # arrive generalement en moins de dix minutes. Le plafond dur de GitHub est
    # de six heures, timeout-minutes ne depasse pas 360.
    timeout-minutes: 180

    env:
      # ═══ POURQUOI CES NOMS-LA, ET PAS GITHUB_SERVER_URL ═══
      #
      # `attach-assets.sh` lit GITHUB_SERVER_URL et GITHUB_REPOSITORY, et sur un
      # runner GitHub ces deux-la designent GitHub, donc ce depot-ci. On ne peut
      # PAS les corriger dans un bloc `env:`: GitHub reserve tout le prefixe
      # GITHUB_ et ignore silencieusement une redefinition. Essaye le
      # 2026-08-30: le clone est parti chercher `echorunner` sur la forge, qui
      # evidemment n'y est pas.
      #
      # On garde donc nos propres noms, et l'etape qui appelle le script les
      # exporte dans SON shell, ce que la reservation n'empeche pas.
      FORGE_URL: https://workspace.prismodev.com
      FORGE_REPO: C4ptainF0xy/echo-launcher

      # ═══ LE TAS DE NODE, SANS QUOI LE RENDERER NE S'ASSEMBLE PAS ═══
      #
      # `electron-vite build` est mort en « JavaScript heap out of memory » a
      # 2030 Mo, le plafond par defaut. Le renderer pese 13,8 Mo de bundle et
      # 21 Mo de sourcemap, et Rollup garde tout en memoire pendant le rendu des
      # chunks. Le runner a 7 Go: 4 Go de tas doublent le plafond en laissant de
      # la place au reste.
      #
      # La machine de la forge ne rencontrait pas ce mur parce qu'elle a 16 Go
      # et un Node configure autrement; ce n'est donc pas un defaut du projet,
      # c'est une difference d'environnement qu'il faut declarer ici.
      NODE_OPTIONS: --max-old-space-size=4096
      TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      INPUT_TAG: ${{ inputs.tag }}
      # La cle Ed25519 qui signe le manifeste de mise a jour. Absente, la
      # release sort non signee EN LE DISANT, ce qui est l'etat d'aujourd'hui et
      # doit continuer de marcher.
      ECHO_UPDATE_SIGNING_KEY: ${{ secrets.ECHO_UPDATE_SIGNING_KEY }}
      # ═══ LA SIGNATURE macOS, ET LES DEUX PIEGES QU'ELLE CACHE ═══
      #
      # Cette app n'a jamais ete signee. La recette de la forge posait
      # CSC_IDENTITY_AUTO_DISCOVERY a "false", ce qui dit litteralement a
      # electron-builder de ne chercher aucune identite: il obeit, saute la
      # signature, saute donc la notarisation qui en depend, et REUSSIT quand
      # meme. Verifie le 2026-08-30 sur le paquet livre: aucun dossier
      # Contents/_CodeSignature, pas meme une signature ad-hoc.
      #
      # PREMIER PIEGE, CSC_LINK. Le passer laisse electron-builder monter son
      # propre trousseau, et il y autorise `apple-tool:` et `apple:` a se
      # servir de la cle privee -- mais pas `codesign:`, qui est pourtant le
      # seul programme qui va la demander. macOS ouvre alors une demande
      # d'autorisation que personne ne voit sur un runner, et codesign attend
      # indefiniment: une heure et demie sur la seule ligne « signing », le
      # 2026-08-30. L'etape « Trousseau de signature » monte donc le trousseau
      # elle-meme, avec la bonne liste, et designe l'identite par CSC_NAME.
      #
      # SECOND PIEGE, APPLE_API_KEY attend un CHEMIN et pas la cle. Y mettre le
      # contenu du .p8 donne un fichier inexistant, notarytool ne trouve rien,
      # et la notarisation est sautee sans faire echouer le build. Le .p8 vit
      # donc dans APPLE_API_KEY_P8, et la meme etape l'ecrit sur le disque
      # avant de pointer APPLE_API_KEY dessus.
      #
      # Les 99 euros du programme developpeur donnent le DROIT d'emettre le
      # certificat et la cle; ils ne les posent sur aucune machine de build.
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: La machine est-elle bien ARM64
        # LA GARDE QUI JUSTIFIE TOUT LE RESTE. Si ce runner n'est pas arm64, le
        # build produira du x64 sans rien dire, on publiera un paquet identique
        # a celui d'aujourd'hui, et on croira le probleme regle. Mieux vaut
        # s'arreter ici.
        run: |
          set -eu
          arch=$(uname -m)
          echo "architecture du runner : $arch"
          sysctl -n machdep.cpu.brand_string || true
          if [ "$arch" != "arm64" ]; then
            echo "Ce runner n'est pas Apple Silicon. Tout l'interet de ce"
            echo "workflow est de construire NATIVEMENT en arm64 : on s'arrete"
            echo "plutot que de republier un paquet Intel."
            exit 1
          fi

      - name: Cloner le launcher depuis la forge
        # Pas actions/checkout: le code n'est pas sur GitHub et ne doit pas y
        # etre. Il est clone ici, sur une machine jetable, et disparait avec
        # elle. --depth 1 sur le tag: on construit une version precise, pas une
        # branche.
        run: |
          set -eu
          case "$INPUT_TAG" in
            v[0-9]*) : ;;
            *) echo "tag inattendu : '$INPUT_TAG'"; exit 1 ;;
          esac
          hote=${FORGE_URL#https://}
          echo "clone de $FORGE_REPO sur $hote, tag $INPUT_TAG"
          git clone --depth 1 --branch "$INPUT_TAG" \
            "https://token:${TOKEN}@${hote}/${FORGE_REPO}.git" .
          git log -1 --format="commit construit : %H %s"

      - name: Outils presents
        run: |
          set -eu
          missing=""
          for tool in node python3 cargo git; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "Outils manquants sur ce runner :$missing"
            exit 1
          fi
          node -v && python3 --version && cargo --version
          # La chaine Rust doit savoir viser cette machine. Sur un runner arm64
          # c'est deja le cas, mais le dire ici evite un echec obscur plus tard.
          rustc -vV | sed -n 's/^host: /cible Rust : /p'

      - name: Python 3.12
        # ═══ LA VERSION EST EPINGLEE, ET CE N'EST PAS DE LA PRUDENCE ═══
        #
        # `libtorrent` ne publie de roues que jusqu'a cp313. Le runner GitHub
        # arrive avec Python 3.14, pour lequel il n'en existe aucune: pip
        # repond « No matching distribution found for libtorrent » et le build
        # s'arrete. Constate le 2026-08-30 au premier essai.
        #
        # 3.12 plutot que 3.13: c'est la version que couvrent a la fois les
        # roues arm64 de libtorrent et cx_Freeze 7.2.3, et suivre la derniere
        # version disponible ferait recasser ce build le jour ou GitHub avance
        # son image, pour aucun gain.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances Python
        # Le venv est celui de la recette d'origine. Sur arm64, pip prend les
        # roues macosx_*_arm64 de libtorrent: rien n'est compile, rien n'est
        # croise, et cx_Freeze figera donc du natif.
        run: |
          set -eu
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet -r requirements.txt
          ./.venv/bin/python -c "import cx_Freeze, libtorrent; print('cx_Freeze et libtorrent sont la')"
          # Ce qui compte vraiment: que le module charge soit bien arm64.
          ./.venv/bin/python - <<'PY'
          import libtorrent, subprocess, sys
          chemin = libtorrent.__file__
          print("libtorrent :", chemin)
          subprocess.run(["file", "-b", chemin], check=False)
          PY
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Dependances
        run: npx yarn install --frozen-lockfile

      - name: Trousseau de signature
        # ═══ POURQUOI ON MONTE LE TROUSSEAU A LA MAIN ═══
        #
        # Laisse a lui-meme, electron-builder importe le certificat et autorise
        # `apple-tool:` et `apple:` a se servir de la cle. Il oublie
        # `codesign:`, qui est pourtant le seul programme qui va la demander.
        # macOS ouvre alors une boite de dialogue que personne ne voit sur un
        # runner, et codesign attend indefiniment: une heure et demie sans un
        # octet de progres, le 2026-08-30.
        #
        # Trois details comptent autant que la liste elle-meme:
        #   - `-lut 21600` retire l'auto-verrouillage, sinon le trousseau se
        #     referme au milieu d'un build long et les signatures suivantes
        #     rouvrent une demande d'autorisation;
        #   - le trousseau doit etre dans la LISTE DE RECHERCHE, sans quoi
        #     codesign ne le regarde pas, meme en le nommant;
        #   - le mot de passe est tire au hasard ici et ne sort jamais: il ne
        #     protege qu'un fichier qui vit le temps du job.
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu

          if [ -z "${APPLE_CERT_P12:-}" ] || [ -z "${APPLE_API_KEY_P8:-}" ]; then
            manque=""
            [ -n "${APPLE_CERT_P12:-}" ] || manque="$manque APPLE_CERT_P12"
            [ -n "${APPLE_API_KEY_P8:-}" ] || manque="$manque APPLE_API_KEY_P8"
            echo "SECRETS DE SIGNATURE ABSENTS :$manque"
            echo "L'app sortira NON SIGNEE. Elle s'installe et se lance, mais"
            echo "macOS avertira a la premiere ouverture et il faudra passer"
            echo "par Reglages > Confidentialite et securite pour l'autoriser."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          secret="$RUNNER_TEMP/signature"
          mkdir -p "$secret"
          chmod 700 "$secret"

          # ---- Le certificat, dans un trousseau a nous -----------------------
          p12="$secret/cert.p12"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$p12"
          trousseau="$secret/echo-signature.keychain-db"
          motdepasse=$(openssl rand -base64 24)

          security create-keychain -p "$motdepasse" "$trousseau"
          security set-keychain-settings -lut 21600 "$trousseau"
          security unlock-keychain -p "$motdepasse" "$trousseau"

          security import "$p12" -k "$trousseau" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # LA LIGNE QUI DEBLOQUE TOUT: `codesign:` en plus des deux autres.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$motdepasse" "$trousseau" >/dev/null

          # Dans la liste de recherche, en gardant celles qui y etaient.
          anciennes=$(security list-keychains -d user | tr -d '"' | tr -s ' ' ' ')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$trousseau" $anciennes

          rm -f "$p12"

          # ---- L'identite, designee par son nom ------------------------------
          # SANS LE PREFIXE. electron-builder refuse « Developer ID
          # Application: Sasha ... » avec « Please remove prefix ... —
          # appropriate certificate will be chosen automatically »: il veut le
          # nom commun seul, et choisit le type de certificat lui-meme d'apres
          # la cible. On ne capture donc que ce qui suit les deux points.
          identite=$(security find-identity -v -p codesigning "$trousseau" \
            | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)
          if [ -z "$identite" ]; then
            echo "aucune identite Developer ID trouvee dans le trousseau."
            echo "le .p12 est-il bien un certificat Developer ID Application ?"
            security find-identity -v "$trousseau" || true
            exit 1
          fi
          echo "identite : $identite"
          echo "CSC_NAME=$identite" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$trousseau" >> "$GITHUB_ENV"

          # ---- La cle de notarisation ----------------------------------------
          # APPLE_API_KEY attend un CHEMIN, pas la cle: y mettre le contenu du
          # .p8 donne un fichier inexistant, notarytool ne trouve rien, et la
          # notarisation est sautee sans que le build echoue.
          cle="$secret/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$cle"
          chmod 600 "$cle"
          head -1 "$cle" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "le .p8 decode n'est pas une cle privee : base64 invalide ?"; exit 1; }
          echo "APPLE_API_KEY=$cle" >> "$GITHUB_ENV"

          # ═══ LA CLE PARLE-T-ELLE A APPLE, OUI OU NON ═══
          #
          # `notarytool history` fait le meme aller-retour authentifie qu'une
          # soumission, mais sans televerser 250 Mo et sans attendre de verdict:
          # il repond en quelques secondes ou il ne repond pas. C'est donc le
          # moyen le moins cher de savoir si l'identifiant, l'emetteur et la cle
          # forment un jeu valide.
          #
          # Ne fait PAS echouer le job: on veut l'information, pas un blocage de
          # plus. Trente secondes suffisent a trancher.
          echo "--- la cle de notarisation repond-elle ---"
          if xcrun notarytool history --key "$cle" \
               --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
               2>&1 | head -12; then
            echo "(reponse obtenue)"
          else
            echo "(pas de reponse exploitable, voir ci-dessus)"
          fi

          echo "trousseau pret."

      - name: Build macOS
        # DEBUG=electron-builder affiche chaque appel a codesign, un par un.
        # Sans ca, le journal s'arrete sur une seule ligne « signing » et une
        # attente d'une heure ressemble a un travail en cours: impossible de
        # savoir si ca signe lentement ou si ca ne signe pas du tout.
        #
        # CSC_FOR_PULL_REQUEST n'a rien a voir ici; ce qui compte est que le
        # trousseau temporaire cree par electron-builder autorise codesign a se
        # servir de la cle sans demander. Une signature qui « dure » est presque
        # toujours une boite de dialogue que personne ne voit.
        env:
          DEBUG: electron-builder
        run: |
          set -u

          # ═══ UN VEILLEUR, PARCE QUE LE SILENCE NE DIT RIEN ═══
          #
          # electron-builder n'ecrit rien entre « signing » et la fin de la
          # signature. Deux situations tres differentes se ressemblent donc
          # exactement: une signature qui avance lentement sur des centaines de
          # binaires, et une signature bloquee sur le premier. On a perdu deux
          # runs entiers a ne pas pouvoir les distinguer.
          #
          # Ce veilleur echantillonne toutes les vingt secondes QUEL fichier
          # codesign est en train de traiter, depuis combien de temps, et
          # combien de signatures sont deja posees. Si le compteur monte, ca
          # travaille; s'il reste a zero avec le meme fichier depuis cinq
          # minutes, c'est bloque, et on saura sur quoi.
          # `--config.mac.notarize=false` va bien a electron-builder: le script
          # build:mac est une chaine de `&&`, donc les arguments ajoutes
          # atterrissent sur la derniere commande, qui est electron-builder.
          # C'est deja comme ca que `--publish never` fonctionne.
          # TOUJOURS false ICI, et ce n'est pas un oubli: la notarisation
          # d'electron-builder appelle `notarytool submit --wait`, qui ne rend
          # pas la main. Elle est faite plus bas, par une etape qui interroge
          # le verdict elle-meme.
          npx yarn build:mac --publish never --config.mac.notarize=false &
          build=$!

          (
            while kill -0 "$build" 2>/dev/null; do
              sleep 20
              echo "···· veilleur $(date +%H:%M:%S) ····"
              enCours=$(ps -Ao etime,command | grep -E "[c]odesign|[n]otarytool|[x]crun" | head -3 || true)
              if [ -n "$enCours" ]; then
                printf '%s\n' "$enCours" | cut -c1-200 | sed 's/^/  /'
              else
                echo "  aucun codesign en cours"
              fi
              posees=$(find dist -name "_CodeSignature" -type d 2>/dev/null | wc -l | tr -d ' ')
              echo "  signatures posees : $posees"
            done
          ) &
          veilleur=$!

          statut=0
          wait "$build" || statut=$?
          kill "$veilleur" 2>/dev/null || true
          exit "$statut"

      - name: Ce que la signature donne
        # Verifie ce qui EST, pas ce qui etait demande. Une signature annoncee
        # et absente est exactement le defaut qu'on repare ici.
        run: |
          set -eu
          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -d "$app/Contents/_CodeSignature" ]; then
            codesign -dv --verbose=2 "$app" 2>&1 | head -8 || true
            spctl -a -vv "$app" 2>&1 | head -4 || true
          else
            echo "app NON SIGNEE (aucun Contents/_CodeSignature)"
          fi

      - name: Notariser et agrafer
        # ═══ POURQUOI ON NE LAISSE PAS electron-builder LE FAIRE ═══
        #
        # Sa notarisation appelle `notarytool submit --wait`, qui est reste
        # 2 h 52 sans rendre la main, trois fois. Et pourtant `notarytool
        # history` montrait DEUX soumissions `status: Accepted` faites pendant
        # ces memes runs: Apple avait repondu, c'est l'attente qui ne voyait
        # pas la reponse.
        #
        # On soumet donc SANS `--wait`, on recupere l'identifiant, et on
        # interroge le verdict nous-memes. Chaque tour s'affiche, donc une
        # attente reelle ne ressemble plus jamais a un blocage.
        #
        # ═══ ET POURQUOI ON REFAIT LE ZIP ═══
        #
        # Agrafer modifie l'application. Le `.zip` produit avant l'agrafage
        # contient donc une copie SANS ticket, et c'est lui que le lanceur
        # telecharge pour se mettre a jour. On le refabrique depuis
        # l'application agrafee, ce qui change sa taille et son empreinte, donc
        # `latest-mac.yml` doit etre corrige et resigne. Sauter cette partie
        # donnerait un manifeste qui decrit un fichier qui n'existe plus, et
        # electron-updater refuserait la mise a jour.
        if: inputs.notariser
        run: |
          set -eu

          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -1)
          dmg=$(find dist -maxdepth 1 -name "*.dmg" | head -1)
          zip=$(find dist -maxdepth 1 -name "*-mac.zip" | head -1)
          for f in "$app" "$dmg" "$zip"; do
            [ -e "$f" ] || { echo "introuvable : $f"; exit 1; }
          done
          echo "app : $app"
          echo "dmg : $dmg"
          echo "zip : $zip"

          identifiants="--key $APPLE_API_KEY --key-id $APPLE_API_KEY_ID --issuer $APPLE_API_ISSUER"

          # ---- 1. Soumettre, sans attendre -----------------------------------
          echo "--- soumission ---"
          # shellcheck disable=SC2086
          reponse=$(xcrun notarytool submit "$dmg" $identifiants --output-format json)
          soumission=$(printf '%s' "$reponse" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { process.stdout.write(String(JSON.parse(s).id ?? "")); } catch { }
            });')
          if [ -z "$soumission" ]; then
            echo "aucun identifiant de soumission dans la reponse :"
            printf '%s\n' "$reponse" | head -20
            exit 1
          fi
          echo "soumission : $soumission"

          # ---- 2. Attendre le verdict, en le disant --------------------------
          #
          # Trente tours d'une minute. Apple rend generalement son verdict en
          # moins d'un quart d'heure; au-dela, mieux vaut s'arreter avec
          # l'identifiant en main - la soumission continue de vivre chez Apple
          # et se rattrape a la main avec `notarytool info`.
          statut=""
          tour=0
          while [ "$tour" -lt 30 ]; do
            tour=$((tour + 1))
            sleep 60
            # shellcheck disable=SC2086
            info=$(xcrun notarytool info "$soumission" $identifiants --output-format json 2>&1 || true)
            statut=$(printf '%s' "$info" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { process.stdout.write(String(JSON.parse(s).status ?? "")); } catch { }
              });')
            echo "  tour $tour : ${statut:-(pas de statut lisible)}"
            case "$statut" in
              Accepted | Invalid | Rejected) break ;;
            esac
          done

          if [ "$statut" != "Accepted" ]; then
            echo "verdict : ${statut:-inconnu}"
            echo "--- ce qu'Apple reproche ---"
            # shellcheck disable=SC2086
            xcrun notarytool log "$soumission" $identifiants 2>&1 | head -60 || true
            exit 1
          fi
          echo "notarisation acceptee."

          # ---- 3. Agrafer ----------------------------------------------------
          #
          # Le dmg et l'application separement: le ticket vaut pour l'empreinte
          # du code, et la notarisation d'un dmg enregistre aussi ce qu'il
          # contient. Agrafer les deux couvre les deux chemins de distribution,
          # le telechargement direct et la mise a jour automatique.
          echo "--- agrafage ---"
          xcrun stapler staple "$dmg"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          # ---- 4. Refaire le zip depuis l'application agrafee -----------------
          #
          # ditto avec --sequesterRsrc et --keepParent: c'est la forme
          # qu'electron-builder produit et qu'electron-updater sait relire.
          echo "--- reconstruction du zip ---"
          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          ls -lh "$zip"

          # ---- 5. Corriger le manifeste --------------------------------------
          #
          # CHAQUE FICHIER A SA PROPRE EMPREINTE, et les deux ont change:
          # le zip parce qu'on vient de le refaire depuis l'application
          # agrafee, le dmg parce que l'agrafage l'a modifie lui aussi.
          #
          # La premiere version de cette etape remplacait `sha512:` et `size:`
          # avec le drapeau global, donc elle ecrasait AUSSI la ligne du dmg
          # avec les valeurs du zip. Le manifeste restait valide, et annoncait
          # simplement un fichier qui n'existe pas: 263075119 octets pour un dmg
          # qui en fait 262 millions. Constate le 2026-08-31 sur le premier
          # manifeste notarise.
          #
          # On repasse donc entree par entree, en s'ancrant sur le nom du
          # fichier, et on relit l'empreinte sur le disque plutot que de la
          # recopier d'ailleurs.
          for f in "$zip" "$dmg"; do
            nom=$(basename "$f")
            NOM="$nom" \
            TAILLE="$(stat -f%z "$f")" \
            EMPREINTE="$(openssl dgst -sha512 -binary "$f" | openssl base64 -A)" \
            node -e '
              const fs = require("fs");
              const chemin = "dist/latest-mac.yml";
              const nom = process.env.NOM;
              const lignes = fs.readFileSync(chemin, "utf8").split("\n");

              // Une entree est « - url: <nom> » suivie de sa sha512 et de sa
              // size. On ne touche qu aux lignes qui suivent CETTE url, et on
              // s arrete a l entree suivante.
              let dansLEntree = false;
              let touche = 0;
              for (let i = 0; i < lignes.length; i++) {
                const l = lignes[i];
                if (/^\s*-\s+url:\s*/.test(l)) {
                  dansLEntree = l.trim().endsWith(nom);
                  continue;
                }
                if (!dansLEntree) continue;
                if (/^\S/.test(l)) { dansLEntree = false; continue; }
                if (/^\s*sha512:/.test(l)) {
                  lignes[i] = l.replace(/sha512:.*/, "sha512: " + process.env.EMPREINTE);
                  touche++;
                } else if (/^\s*size:/.test(l)) {
                  lignes[i] = l.replace(/size:.*/, "size: " + process.env.TAILLE);
                  touche++;
                }
              }

              // Les champs de tete decrivent le fichier de mise a jour, donc le
              // zip: on ne les corrige que pour lui.
              if (lignes.some((l) => l.startsWith("path: " + nom))) {
                for (let i = 0; i < lignes.length; i++) {
                  if (/^sha512:/.test(lignes[i])) {
                    lignes[i] = "sha512: " + process.env.EMPREINTE;
                    touche++;
                  }
                }
              }

              if (touche === 0) {
                console.error("aucune ligne corrigee pour " + nom);
                process.exit(1);
              }
              fs.writeFileSync(chemin, lignes.join("\n"), "utf8");
              console.log("  " + nom + " : " + touche + " ligne(s) corrigee(s)");
            '
          done
          cat dist/latest-mac.yml

          # ---- 6. Resigner le manifeste --------------------------------------
          if [ -n "${ECHO_UPDATE_SIGNING_KEY:-}" ]; then
            node scripts/signer-manifeste.mjs dist/latest-mac.yml
          fi

          echo "--- verdict final ---"
          spctl -a -vv "$app" 2>&1 | head -4 || true

      - name: Le paquet est-il vraiment ARM64
        # LA SECONDE GARDE, ET LA PLUS IMPORTANTE. Un build qui retombe en x64
        # sans le dire est exactement le defaut qu'on repare: il produit un
        # paquet qui s'installe, qui se lance, et qui rame. Un `file` sur le
        # binaire principal tranche en une ligne.
        run: |
          set -eu
          [ -d dist ] || { echo "PAS DE DOSSIER dist"; exit 1; }
          ls -lh dist | head -20 || true

          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -1)
          [ -n "$app" ] || { echo "aucune .app produite"; exit 1; }
          bin="$app/Contents/MacOS/$(basename "${app%.app}")"
          [ -f "$bin" ] || bin=$(find "$app/Contents/MacOS" -type f -perm +111 | head -1)

          echo "binaire principal : $bin"
          file -b "$bin"
          if ! file -b "$bin" | grep -qE "arm64"; then
            echo "LE BINAIRE N'EST PAS ARM64. C'est precisement le defaut que ce"
            echo "workflow existe pour corriger : on ne publie pas."
            exit 1
          fi
          echo "paquet ARM64 confirme"

      - name: Signer le manifeste macOS
        run: |
          set -eu
          if [ -n "${ECHO_UPDATE_SIGNING_KEY:-}" ]; then
            node scripts/signer-manifeste.mjs dist/latest-mac.yml
            [ -f dist/latest-mac.yml.sig ] \
              || { echo "signature annoncee mais absente"; exit 1; }
          else
            echo "PAS DE CLE DE PUBLICATION : latest-mac.yml sort NON SIGNE."
          fi

      - name: Attacher a la release de la forge
        # Le script vient du depot du launcher, qu'on vient de cloner: une seule
        # facon d'attacher des assets, partagee par les trois plateformes.
        run: |
          set -eu
          # Exportees ICI, dans le shell de l'etape: le bloc `env:` d'un job ne
          # peut pas redefinir une variable en GITHUB_, la reservation ne
          # s'applique pas a un export shell. Sans ces deux lignes, le script
          # televerserait vers ce depot GitHub au lieu de la forge.
          export GITHUB_SERVER_URL="$FORGE_URL"
          export GITHUB_REPOSITORY="$FORGE_REPO"

          exacts="latest-mac.yml"
          [ -f dist/latest-mac.yml.sig ] && exacts="$exacts latest-mac.yml.sig"
          sh .forgejo/scripts/attach-assets.sh "dmg zip" "$exacts"
